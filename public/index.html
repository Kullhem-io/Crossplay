<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e17">
  <title>Crossplay</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chatroom">
    <header class="chat-header">
      <h1>Crossplay</h1>
      <div class="status-indicator">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">Idle</span>
        <span id="turnCounter" class="turn-counter"></span>
      </div>
    </header>

    <!-- Unified start panel with mode selection -->
    <div id="startPanel" class="start-panel">
      <div class="mode-selector">
        <label>
          <input type="radio" name="mode" value="chat" checked>
          <span class="mode-option chat-mode">Chat Mode</span>
        </label>
        <label>
          <input type="radio" name="mode" value="game">
          <span class="mode-option game-mode">Game Mode (RPG)</span>
        </label>
      </div>
      <input type="text" id="topicInput" placeholder="Enter a topic to discuss...">
      <button id="startBtn" class="btn btn-primary">Start</button>
    </div>

    <!-- Character panels (game mode only, hidden by default) -->
    <div id="gamePanels" class="game-panels hidden">
      <div id="qwenCharPanel" class="char-panel qwen-panel">
        <div class="char-header">
          <span class="char-name" id="qwenCharName">—</span>
          <span class="char-class" id="qwenCharClass">—</span>
        </div>
        <div class="hp-bar-container">
          <div class="hp-bar" id="qwenHpBar" style="width: 100%">
            <span class="hp-text" id="qwenHpText">0/0</span>
          </div>
        </div>
        <div class="stats-grid">
          <span class="stat">Level: <b id="qwenLevel">1</b></span>
          <span class="stat">Atk: <b id="qwenAtk">0</b></span>
          <span class="stat">Def: <b id="qwenDef">0</b></span>
          <span class="stat">Exp: <b id="qwenXp">0/200</b></span>
        </div>
        <div class="inventory" id="qwenInventory"></div>
        <div class="status-effects" id="qwenStatusEffects"></div>
      </div>
      <div id="gemmaCharPanel" class="char-panel gemma-panel">
        <div class="char-header">
          <span class="char-name" id="gemmaCharName">—</span>
          <span class="char-class" id="gemmaCharClass">—</span>
        </div>
        <div class="hp-bar-container">
          <div class="hp-bar" id="gemmaHpBar" style="width: 100%">
            <span class="hp-text" id="gemmaHpText">0/0</span>
          </div>
        </div>
        <div class="stats-grid">
          <span class="stat">Level: <b id="gemmaLevel">1</b></span>
          <span class="stat">Atk: <b id="gemmaAtk">0</b></span>
          <span class="stat">Def: <b id="gemmaDef">0</b></span>
          <span class="stat">Exp: <b id="gemmaXp">0/200</b></span>
        </div>
        <div class="inventory" id="gemmaInventory"></div>
        <div class="status-effects" id="gemmaStatusEffects"></div>
      </div>
    </div>

    <!-- Location bar (game mode only) -->
    <div id="locationBar" class="location-bar hidden">
      <span id="locationName">—</span>
      <span id="locationDesc" class="location-desc">—</span>
    </div>

    <div id="controlPanel" class="control-panel hidden">
      <button id="pauseBtn" class="btn">Pause</button>
      <button id="resumeBtn" class="btn hidden">Resume</button>
      <button id="stopBtn" class="btn btn-danger">Stop</button>
    </div>

    <div id="messageList" class="message-list"></div>

    <div class="input-area">
      <input type="text" id="userMessage" placeholder="Send a message to the agents..." disabled>
      <button id="sendBtn" class="btn btn-primary" disabled>Send</button>
    </div>

    <!-- Game over overlay -->
    <div id="gameOverOverlay" class="game-over-overlay hidden">
      <div class="game-over-content">
        <h2>Game Over</h2>
        <p id="gameOverReason"></p>
        <p id="gameOverWinner"></p>
        <button id="newGameBtn" class="btn btn-primary">New Game</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
